name: Build Test Image

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  IMAGE_NAME: atomicvlm
  IMAGE_TAG: test
  MODULE_REPOS: PowerShell-IMDB PowerShell-AppleTVplus PowerShell-AtomicVLM

jobs:

  # Builds the test target on a native runner for each platform and pushes it to ghcr.io by digest only (no tag).
  # The merge job below combines the two digests into one multi-platform image tagged atomicvlm:test.
  buildTestImage:
    name: Build Test Image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        run: |
          echo "REGISTRY_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_ENV"
          echo "PLATFORM_PAIR=${{ matrix.platform }}" | tr '/' '-' >> "$GITHUB_ENV"

      # The Dockerfile's test stage copies every module folder in test-modules into the all-users PowerShell module
      # folder, replacing any Gallery copy. Each release zip contains the module folder itself (po.IMDB/,
      # po.AppleTVplus/, po.AtomicVLM/), so unzipping into test-modules is all that is needed.
      #
      # The module repos are separate private repositories, so the default GITHUB_TOKEN cannot read their releases.
      # MODULE_REPOS_TOKEN is a personal access token with read access to Contents in those repos.
      - name: Download latest module releases
        env:
          GH_TOKEN: ${{ secrets.MODULE_REPOS_TOKEN }}
        run: |
          mkdir -p test-modules "$RUNNER_TEMP/module-zips"
          for repo in $MODULE_REPOS; do
            echo "Fetching latest release of $repo"
            gh release download --repo "${GITHUB_REPOSITORY_OWNER}/$repo" --pattern '*.zip' \
                --dir "$RUNNER_TEMP/module-zips/$repo"
            for zip in "$RUNNER_TEMP/module-zips/$repo"/*.zip; do
              unzip -q -o "$zip" -d test-modules
            done
          done
          ls -la test-modules

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push test image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=test-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=test-${{ env.PLATFORM_PAIR }},mode=max

      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  mergeManifest:
    name: Publish Multi-Platform Image
    runs-on: ubuntu-latest
    needs: buildTestImage
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set image name
        run: echo "REGISTRY_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create --tag "${REGISTRY_IMAGE}:${IMAGE_TAG}" \
              $(printf "${REGISTRY_IMAGE}@sha256:%s " *)

      - name: Inspect image
        run: docker buildx imagetools inspect "${REGISTRY_IMAGE}:${IMAGE_TAG}"
